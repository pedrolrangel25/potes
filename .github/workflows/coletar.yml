name: Coletar dados de mercado

on:
  schedule:
    - cron: '0 11 * * 1-5'   # dias úteis, 8h (Brasília)
  workflow_dispatch:          # botão "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/coletar.mjs
      - name: Salvar dados
        run: |
          git config user.name "robo-coletor"
          git config user.email "robo-coletor@users.noreply.github.com"
          git add data/mercado.json
          git diff --cached --quiet || git commit -m "Atualiza dados de mercado"
          git push
